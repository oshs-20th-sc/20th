<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>글 작성</title>
    <link rel="stylesheet" href="../style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="container">
      <header class="section-top">
        <h1>글 작성</h1>
      </header>
      <p class="muted">2026년 11월 23일(월) · 점심시간 현장 참여</p>
      <p id="event-status" role="status">접수 상태 확인 중</p>
      <button id="retry-event" type="button" hidden>다시 확인</button>
      <p id="error" class="error" role="alert" hidden></p>

      <section id="editor" class="panel">
        <form id="write-form" novalidate>
          <label for="student-number">학번</label>
          <input
            id="student-number"
            name="studentNumber"
            inputmode="numeric"
            autocomplete="off"
            maxlength="5"
            required
            aria-describedby="identity-help"
          />
          <label for="student-name">이름</label>
          <input
            id="student-name"
            name="name"
            autocomplete="off"
            maxlength="30"
            required
            aria-describedby="identity-help"
          />
          <p id="identity-help" class="muted">학번과 이름은 운영진 확인용으로 저장되며 공개되지 않습니다.</p>

          <label for="nickname">별명</label>
          <input
            id="nickname"
            name="nickname"
            autocomplete="off"
            aria-describedby="nickname-help"
          />
          <p id="nickname-help" class="muted">선택 · 최대 30자 · 미입력 시 익명</p>

          <label for="content">본문</label>
          <textarea
            id="content"
            name="content"
            rows="10"
            required
            aria-describedby="content-count privacy"
          ></textarea>
          <p id="content-count" class="muted">0자</p>
          <p id="privacy" class="muted">
            본문에 개인정보를 적지 마세요. 승인된 본문과 별명은 공개됩니다.
          </p>

          <label class="checkbox">
            <input id="consent" name="consent" type="checkbox" required />
            공개 동의 (필수)
          </label>
          <p id="pending-status" class="notice" role="status" hidden>
            접수 확인 전입니다. 같은 내용으로 다시 제출할 수 있습니다.
          </p>
          <div class="actions">
            <button id="submit" type="submit" class="primary" disabled>제출</button>
            <button id="clear-form" type="button" disabled>초기화</button>
          </div>
        </form>
      </section>
      <section id="complete" class="panel" tabindex="-1" aria-labelledby="complete-title" hidden>
        <h2 id="complete-title">접수 완료</h2>
        <button id="new-letter" type="button">새 글</button>
      </section>
      <noscript>JavaScript를 활성화해 주세요.</noscript>
    </main>
  </body>
</html>
