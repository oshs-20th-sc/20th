<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>글 작성</title>
    <link rel="stylesheet" href="../style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="container">
      <header class="section-top">
        <h1>글 작성</h1>
      </header>
      <div id="login"></div>
      <div id="student-view" hidden>
        <p id="event-status" role="status">접수 상태 확인 중</p>
        <button id="retry-event" type="button" hidden>다시 확인</button>
        <p id="error" class="error" role="alert" hidden></p>

        <section id="editor" class="panel">
          <form id="write-form" novalidate>
            <label for="nickname">별명</label>
            <input
              id="nickname"
              name="nickname"
              autocomplete="off"
              aria-describedby="nickname-help"
            />
            <p id="nickname-help" class="muted">선택 · 최대 30자 · 미입력 시 익명</p>

            <label for="content">본문</label>
            <textarea
              id="content"
              name="content"
              rows="10"
              required
              aria-describedby="content-count privacy"
            ></textarea>
            <p id="content-count" class="muted">0 / 700자 · 최소 10자</p>
            <p id="privacy" class="muted">
              개인정보를 입력하지 마세요. 승인된 글과 별명은 공개됩니다.
            </p>

            <label class="checkbox">
              <input id="consent" name="consent" type="checkbox" required />
              공개 동의 (필수)
            </label>
            <p id="pending-status" class="notice" role="status" hidden>
              접수 확인 전입니다. 같은 내용으로 다시 제출할 수 있습니다.
            </p>
            <div class="actions">
              <button id="submit" type="submit" class="primary" disabled>제출</button>
              <button id="clear-form" type="button" disabled>초기화</button>
            </div>
          </form>
        </section>
      </div>
      <section id="complete" class="panel" tabindex="-1" aria-labelledby="complete-title" hidden>
        <h2 id="complete-title">접수 완료</h2>
        <p>접수번호 <code id="receipt"></code></p>
        <button id="new-letter" type="button">새 글</button>
      </section>
      <noscript>JavaScript를 활성화해 주세요.</noscript>
    </main>
  </body>
</html>
